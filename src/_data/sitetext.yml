en: &DEFAULT_EN
  header:
    title: "AWS & GCP Cloud Platforms for Startups"
    subtitle: "I help post-seed startups turn MVP infrastructure into secure, scalable, production-ready cloud platforms."
    keywords: "AWS · GCP · Kubernetes · Terraform · CI/CD · Cloud Architecture"
    closing: "From architecture and infrastructure-as-code to production deployment — without building a DevOps team from scratch."
    button: Talk about your infrastructure
    buttonlink: "#contact"
    button2: See how I work
    buttonlink2: "#how-i-work"

  audience:
    title: "Built for startups moving beyond the MVP"
    text: "You already have a product and customers. Now the infrastructure needs to catch up."
    intro: "I work with CTOs and engineering teams that need to:"
    section: audience
    list:
      - "move an MVP into production"
      - "establish a proper AWS or GCP foundation"
      - "prepare infrastructure for enterprise customers"
      - "reduce cloud infrastructure costs"
      - "migrate between cloud providers"
      - "introduce Kubernetes without creating unnecessary complexity"
      - "establish Terraform/IaC and CI/CD standards"
      - "prepare for security, compliance and future audits"
    closing: "If you need another DevOps engineer, I'm probably not the right fit. If you need someone to take ownership of the cloud platform problem, we should talk."

  services:
    title: "What I help with"
    text: ""
    section: services
    list:
      - title: "Cloud Platform Architecture"
        desc: "Design and build production-ready AWS and GCP foundations around the needs of your application — networking, identity, security, environments, Kubernetes, observability and automation."
        icon: fas fa-cloud #find more at https://fontawesome.com/v5/search?q=a&o=r&ic=free
        link: "#"
      - title: "MVP → Production"
        desc: "Take infrastructure that was good enough for an MVP and turn it into a platform that can support production traffic, engineering teams and enterprise customers."
        icon: fas fa-rocket
        link: "#"
      - title: "AWS & GCP Architecture Reviews"
        desc: "Identify architectural, security, reliability, operational and cost issues before they become expensive technical debt."
        icon: fab fa-amazon
        link: "#"
      - title: "Cloud Migration"
        desc: "Plan and execute AWS, GCP and workload migrations with particular focus on networking, identity, data, availability and operational continuity."
        icon: fas fa-cloud-upload-alt
        link: "#"
      - title: "Infrastructure as Code & CI/CD"
        desc: "Establish reusable Terraform/Terragrunt foundations and GitHub Actions/GitLab CI pipelines for infrastructure and application delivery."
        icon: fas fa-cog
        link: "#"
      - title: "Cloud Cost Optimization"
        desc: "Identify unnecessary infrastructure spend and architectural decisions that are driving your cloud bill."
        icon: fas fa-dollar-sign
        link: "#"
      - title: "SecOps"
        desc: "Find the weak points in your application and infrastructure security, fix them, and get your cloud setup ready for audits like ISO 27001 and SOC 2."
        icon: fas fa-shield-alt
        link: "#"


  portfolio:
    # https://medium.com/tmw-interactive/creating-dynamic-layouts-with-jekyll-3bbb7fc57d1f
    title: "Case studies"
    text: "A brief summary of the recent projects that were delivered"
    section: portfolio
    closebutton: "Close Project"


  description:
    title: "Description"
    text: "FAQ"
    section: description
    # left is the default
    #start_align: "left"
    events:
      - slug: "Who I am?"
        title: "AWS Cloud expert & DevOps evangelist"
        # desc: "A team of DevOps engineers from TOP5 Ukrainian IT companies with 5-8+ years of experience in providing DevOps services in enterprise domain."
        desc: "I'm one man with an army behind. I'm a nightmare for any outsourcing company. I realised that he can do it better without corporate bull-s%#t. I played many roles in TOP5 IT compnies in Ukraine and gained the priceless experience."
        image: assets/img/about2/1.png
        alt:
      - slug: "What am I doing?"
        title: "Build cloud platforms in AWS & GCP"
        desc: "I build AWS Cloud Platforms based on the application needs, adjust application architecture according to [AWS Cloud Adoptation](https://aws.amazon.com/cloud-adoption-framework/) framework and create CoE team to support the platform."
        image: assets/img/about2/2.png
        alt:
      - slug: "What else?"
        title: "Enforce DevOps standars from beginning"
        desc: "I enforce DevOps best practices and standards that actually work to allow dev teams to be self-capable."
        image: assets/img/about2/3.png
        alt:
      - slug: "How I do it?"
        title: "Collective knowledge sanitized into internal standards"
        desc: "I adopted the best practices from [AWS Well-Architected framework](https://aws.amazon.com/architecture/well-architected) and packaged those into internal standards that are being delivered by the people I trust. This hard work allows to work smart and covers security, automation, kubernetes, monitoring, CI/CD and infrastructure as code with terraform."
        image: assets/img/about2/4.png
        alt:
      - slug: "Why do I do it?"
        title: "To eliminate DevOps technical debt from early project stages."
        desc: "Most of the small solutions are forced to start without decent DevOps expertice. My service offering allows to skip the need of hiring the DevOps engineers and eliminate the technical debt from early project stages."
        image: assets/img/about2/5.png
        # alt: image alt text
      # - slug: "Why we do it?"
      #   title: "To eliminate DevOps technical debt from early project stages"
      #   desc: "Most of the small solutions are forced to start without decent DevOps expertice. My service offering allows to skip the need of hiring the DevOps engineers and eliminate the technical debt from early project stages."
      #   image: assets/img/about2/6.png
    # end: ""

  about:
    title: "About"
    text: ""
    body: |
      After 10+ years of DevOps Team leadership, Delivery management of DevOps Projects, mentoring DevOps engineers I decided to create a side-hustle to deliver exceptional solutions to the products on the early phases.<br><br>
      I treat every project as my personal so you can offload all devops and cloud-related decisions on to me (solutions, technologies, communication with cloud account managers, etc.).
    section: about

  positioning:
    title: "I don't sell DevOps hours"
    section: positioning
    lead: "You don't need another person to maintain a backlog of infrastructure tickets."
    body:
      - "You need someone who can understand the application, make the architectural decisions, build the platform and establish the engineering standards around it."
      - "That's what I do."
      - "Once the foundation is established, I create an internal capability around it rather than keeping you dependent on an external consultant."

  howiwork:
    title: "How I work"
    text: ""
    section: how-i-work
    list:
      - number: "01"
        title: "Assess"
        desc: "Understand the application, current infrastructure, business constraints and future requirements."
      - number: "02"
        title: "Design"
        desc: "Define the target architecture, infrastructure standards and implementation roadmap."
      - number: "03"
        title: "Build"
        desc: "Implement the cloud foundation, IaC, Kubernetes, CI/CD and required platform components."
      - number: "04"
        title: "Launch"
        desc: "Bring the application into production with the operational foundations required to run it reliably."
      - number: "05"
        title: "Extend"
        desc: "Continue evolving the platform through a small expert team / Center of Excellence when ongoing support is required."

  clients:
    section: clients
    max-height: 100px
    horizontal-scrolling: "" #"yes/no"
    list:
      - title: "envato"
        url: https://github.com/raviriley/agency-jekyll-theme
