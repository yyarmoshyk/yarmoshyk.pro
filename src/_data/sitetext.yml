en: &DEFAULT_EN
  header:
    title: "AWS & GCP Cloud Platforms for Startups"
    subtitle: "I help post-seed startups turn MVP infrastructure into secure, scalable, production-ready cloud platforms."
    keywords: "AWS · GCP · Kubernetes · Terraform · CI/CD · Cloud Architecture"
    closing: "From architecture and infrastructure-as-code to production deployment — without building a DevOps team from scratch."
    button2: See how I work
    buttonlink2: "#how-i-work"

  audience:
    title: "Built for startups moving beyond the MVP"
    text: "You already have a product and customers. Now the infrastructure needs to catch up."
    intro: "I work with CTOs and engineering teams that need to:"
    section: audience
    list:
      - "move an MVP into production"
      - "establish a proper AWS or GCP foundation"
      - "prepare infrastructure for enterprise customers"
      - "reduce cloud infrastructure costs"
      - "migrate between cloud providers"
      - "introduce Kubernetes without creating unnecessary complexity"
      - "create Terraform/Terragrunt IaC framework to manage cloud infrastructure"
      - "enforce CI/CD standards"
      - "prepare for security, compliance and future audits"
    closing: "If you need another DevOps engineer, I'm probably not the right fit. If you need someone to take ownership of the cloud platform problem, we should talk."

  services:
    title: "Services I provide"
    text: ""
    section: services
    list:
      - title: "Cloud Platform Architecture"
        desc: "Design and build production-ready AWS and GCP foundations around the needs of your application — networking, identity, security, environments, Kubernetes, observability and automation."
        icon: fas fa-cloud #find more at https://fontawesome.com/v5/search?q=a&o=r&ic=free
        link: "/startup-cloud-platform/"
      - title: "AWS Consulting"
        desc: "Landing Zones, account structure, networking, IAM, EKS and Terraform foundations for startups building on AWS."
        icon: fab fa-aws
        link: "/aws-consulting/"
      - title: "GCP Consulting"
        desc: "Landing Zones, resource hierarchy, networking, IAM, GKE and Terraform foundations for startups building on Google Cloud."
        icon: fab fa-google
        link: "/gcp-consulting/"
      - title: "Cloud Migrations"
        desc: "Migrate workloads into or between AWS and GCP cloud platforms with particular focus on networking, identity, data, availability and operational continuity."
        icon: fas fa-cloud-upload-alt
        link: "/cloud-migration/"
      - title: "AWS Well-Architected Reviews"
        desc: "Assess your workload against the six pillars and turn it into a prioritized, fundable roadmap instead of a generic checklist."
        icon: fas fa-rocket
        link: "/aws-well-architected/"
      - title: "Infrastructure as Code & CI/CD"
        desc: "Establish reusable Terraform/Terragrunt foundations and GitHub Actions/GitLab CI pipelines for infrastructure and application delivery."
        icon: fas fa-cog
        link: "/iac-cicd/"
      - title: "FinOps"
        desc: "Cloud Cost Optimization by identifying the unnecessary AWS and GCP cloud spends and architectural decisions that are driving your cloud bill."
        icon: fas fa-dollar-sign
        link: "/finops/"
      - title: "SecOps"
        desc: "Find the weak points in your application and infrastructure security, fix them, and get your cloud setup ready for audits like ISO 27001 and SOC 2."
        icon: fas fa-shield-alt
        link: "/secops/"


  portfolio:
    # https://medium.com/tmw-interactive/creating-dynamic-layouts-with-jekyll-3bbb7fc57d1f
    title: "Case studies"
    text: "A brief summary of the recent projects that were delivered"
    section: portfolio
    closebutton: "Close Project"


  about:
    title: "About"
    text: ""
    body: |
      My name is Yaroslav Yarmoshyk ([LinkedIN](https://www.linkedin.com/in/yaroslav-yarmoshyk/)), I'm a certified multi-cloud architect and DevOps leader with 17+ years of engineering experience specializing in **AWS** & **GCP** platform engineering.<br><br>
      I work with post-seed and growing startups to build scalable, secure and cost-efficient cloud platforms. I design AWS and GCP Landing Zones, infrastructure as code with Terraform+Terragrunt, Kubernetes, CI/CD pipelines and operational standards that support growth without creating unnecessary financial or operational overhead.<br><br>
      I bring 17 years of hands-on IT experience, mostly learned the hard way by solving complex cloud and DevOps problems in real production environments, through difficult migrations, failures, incidents. Now I turn that into repeatable patterns and practical solutions. I have accumulated a set of engineering patterns, architectural decisions and operational practices that I now use to help startups avoid the expensive infrastructure mistakes I have seen throughout my career.<br><br>
      My goal is to build the right technical foundation early, so business can scale without drowning in technical debt, cloud costs, operational complexity or expensive rework later.<br><br>
      My approach is simple: understand the product first, build only what the product actually needs in GCP or AWS, automate what should be automated and establish the standards that allow the engineering team to operate independently (branching strategies, CI/CD pipelines).<br><br>
      I focus on AWS and GCP cloud architecture, infrastructure-as-code, Kubernetes, CI/CD, cloud migrations and production readiness.
    section: about

  positioning:
    title: "I don't do Everything-DevOps-as-a-service"
    section: positioning
    lead: "You don't need another person to maintain a backlog of infrastructure tickets."
    body:
      - "You need someone who can understand the application, make the architectural decisions, build cloud platform and establish DevOps standards around it."
      - "I take the <b>ownership of the Cloud and DevOps segments</b> of your product to offload this from the CTO and Engineering leadership so that you can focus on the product and business growth rather than infrastructure and DevOps issues."
      - "The best advantage is that we agree the scope before engagement, so you know exactly what you are getting and how much it will cost. No surprises, no open-ended engagements. No hiring, no onboarding, no technical interviews."
      - "Collaboration is simple, fast and transparent."

  howiwork:
    title: "How I work"
    text: "Adopt Well Architected Framework principles juiced with the common sense for your particular case."
    section: how-i-work
    list:
      - number: "01"
        title: "Assess"
        desc: |
          Understand the application, current infrastructure, business constraints and future requirements.<br><br>
          We meet and talk about your current state, future goals and current issues you'd like to address first.
      - number: "02"
        title: "Design"
        desc: |
          Based on the outcomes of assessment I prepare the solution design of the target cloud architecture, infrastructure standards and implementation roadmap.<br><br>
          The estimates are being provided based on the roadmap. <br><br>
          The solution proposal is presented to your team for review to ensure we are aligned on the approach and the implementation plan.
      - number: "03"
        title: "Build"
        desc: |
          I lead the implementation of the cloud foundation, IaC, Kubernetes, CI/CD and required platform components according to the design and roadmap.<br><br>
          At this stage I can work with your engineering team or with my trusted team of DevOps engineers to implement the solution.<br><br>
          <b>With my team I can guarantee the in-time delivery.</b> (Costs: $) <br><br>
          With your team - it depends on their availability and skills. (Costs: $$$) <br><br>
          I can also train your team to implement the solution themselves. (Costs: $$$$) <br><br>
      - number: "04"
        title: "Launch"
        desc: |
          Bring the application into production with the operational foundations required to run it reliably. <br><br>
          This is a natural step to promote the resulting platform into production.<br><br> 
          I don't consider my work as finished here. I provide support and consultations about the platform and the application.<br><br>
      - number: "05"
        title: "Extend"
        desc: |
          Continue evolving the platform through a small expert team in Center of Excellence mode<br><br>
          At least one member of my team remains assigned to your project for ongoing support, consultations and implementation of new features.<br><br>
          I can train your team to operate the platform independently or help you hire the right talents to support the platform in-house.<br><br>
          I can build the DevOps and SRE teams along with processes for you upon implementation. 

  technologies:
    title: "Technologies"
    text: ""
    section: technologies
    list:
      - category: "Cloud Platforms"
        items: "AWS · GCP"
      - category: "Infrastructure"
        items: "Terraform · Terragrunt · Kubernetes · Ansible · Helm"
      - category: "CI/CD"
